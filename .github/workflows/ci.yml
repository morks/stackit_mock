name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: new advisories can appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  security:
    name: Security (govulncheck, gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # newest patch release, so fixed standard-library vulnerabilities are picked up
          go-version: stable
          check-latest: true
      - name: govulncheck (known vulnerabilities in dependencies and the standard library)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec (static security analysis)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
